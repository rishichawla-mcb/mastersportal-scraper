{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block body %}
<h1>My account</h1>
<div class="card" style="max-width:420px">
  <h2>Change password</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><label>Current password<br><input name="current" type="password" required style="width:100%"></label></p>
    <p><label>New password (10+ characters)<br><input name="new" type="password" minlength="10" required style="width:100%"></label></p>
    <button>Change password</button>
  </form>
</div>
{% endblock %}
